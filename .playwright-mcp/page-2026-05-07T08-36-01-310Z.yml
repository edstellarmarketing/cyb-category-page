          - heading "Global Writing Rules" [level=2] [ref=e2814]
        - generic [ref=e2815]:
          - generic [ref=e2816]:
            - paragraph [ref=e2817]: No em-dashes
            - paragraph [ref=e2818]: Replace every — with a period, comma, or colon. No exceptions. This rule is violated frequently — check every section after writing.
          - generic [ref=e2819]:
            - paragraph [ref=e2820]: No 'Course'
            - paragraph [ref=e2821]: Always use 'program', 'training program', or 'training programs'. 'Course' is only allowed inside FAQ answers.
          - generic [ref=e2822]:
            - paragraph [ref=e2823]: No accreditation claims
            - paragraph [ref=e2824]: Edstellar is not an accreditation body and is not a training partner for any certification-providing governing body. Never write 'Edstellar-certified', 'certified by Edstellar', 'official training partner of [body]', 'authorized training provider for [body]', or anything that implies Edstellar grants or is affiliated with industry certifications.
          - generic [ref=e2825]:
            - paragraph [ref=e2826]: No guessed URLs
            - paragraph [ref=e2827]: "CTAs link only to #contact, #catalog, or a confirmed edstellar.com URL. Never invent or guess a URL for a program, blog, or page."
          - generic [ref=e2828]:
            - paragraph [ref=e2829]: No 'vendor-certified'
            - paragraph [ref=e2830]: Always 'certified trainers'. The word 'vendor-certified' has been removed from all components. Do not reintroduce it.
          - generic [ref=e2831]:
            - paragraph [ref=e2832]: "Instructor-led is #1 USP"
            - paragraph [ref=e2833]: The phrase 'instructor-led' must appear at minimum 8 times per category page. It must appear in the hero, H1 section, catalog, featured programs, about, pricing, and approach sections.
          - generic [ref=e2834]:
            - paragraph [ref=e2835]: Bold 'customized instructor-led training'
            - paragraph [ref=e2836]: In WelcomeStrip paragraph 2, the phrase 'customized instructor-led training' must be wrapped in <strong> tags. This is the primary USP visual anchor on the page.
          - generic [ref=e2837]:
            - paragraph [ref=e2838]: No eyebrow headings
            - paragraph [ref=e2839]: Do not place a small uppercase label above any section heading. Section headings must stand alone and carry the section identity without an eyebrow. The only exception is the slide category label inside HeroSlider, which is scoped to the hero slide UI.
          - generic [ref=e2840]:
            - paragraph [ref=e2841]: LOCKED fields stay locked
            - paragraph [ref=e2842]: Delivery format on program cards, blockquote in About section, and package names and license counts must not be changed between categories.
          - generic [ref=e2843]:
            - paragraph [ref=e2844]: No two adjacent sections with the same background
            - paragraph [ref=e2845]: Every section must alternate between bg-white and bg-[#F5F3FF]. Two consecutive sections with the same background colour merge visually into one block and destroy page rhythm. Before finalising the page, audit every section in render order and fix any match.
