          - paragraph [ref=e1380]: Prerequisites vary by program level. Entry-level skilling programs for new hires or lateral movers into security roles have no formal prerequisites. Intermediate programs in cloud security or GRC typically require some domain familiarity, while advanced programs in penetration testing or red-teaming require prior hands-on experience. Edstellar's pre-enrollment skill-mapping exercise identifies the right level for each role in your team.
