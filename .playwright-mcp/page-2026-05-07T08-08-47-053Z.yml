    - generic [ref=e1318]:
      - heading "Frequently Asked Questions" [level=2] [ref=e1319]
      - generic [ref=e1320]:
        - generic [ref=e1321]:
          - button "Which roles and designations should attend Edstellar's cybersecurity training programs?" [ref=e1322] [cursor=pointer]:
            - generic [ref=e1323]: Which roles and designations should attend Edstellar's cybersecurity training programs?
            - generic [ref=e1324]: +
          - paragraph [ref=e1325]: Edstellar's cybersecurity group training programs are built for enterprise security and IT teams. Roles that benefit most include SOC analysts, cloud security engineers, penetration testers, GRC analysts, security architects, DevSecOps engineers, and incident response leads. L&D teams upskilling or reskilling employees into security functions can use Edstellar's role-mapping service to identify the right program for each designation before enrolling a cohort.
        - generic [ref=e1326]:
          - button "How are the cybersecurity training programs delivered?" [ref=e1327] [cursor=pointer]:
            - generic [ref=e1328]: How are the cybersecurity training programs delivered?
            - generic [ref=e1329]: +
          - paragraph [ref=e1330]: All programs are delivered instructor-led, either on-site at your office premises or virtually through VILT (Virtual Instructor-Led Training). There are no self-paced or recorded modules. Every session is live, facilitated by a certified cybersecurity practitioner, and structured as a closed cohort for your team only. You choose the format, location, language, and schedule.
        - generic [ref=e1331]:
          - button "Can the training program be customized for our organization's specific requirements?" [ref=e1332] [cursor=pointer]:
            - generic [ref=e1333]: Can the training program be customized for our organization's specific requirements?
            - generic [ref=e1334]: +
          - paragraph [ref=e1335]: Yes. Edstellar does not deliver off-the-shelf catalog programs. Every cybersecurity training program is designed around your threat model, your technology stack, your team's current capability level, and your compliance obligations. The customization process starts with a discovery call where we map your roles and skill gaps before a trainer is shortlisted or a schedule is confirmed.
        - generic [ref=e1336]:
          - button "How many employees can attend a cybersecurity group training cohort?" [ref=e1337] [cursor=pointer]:
            - generic [ref=e1338]: How many employees can attend a cybersecurity group training cohort?
            - generic [ref=e1339]: +
          - paragraph [ref=e1340]: Edstellar runs focused cohorts from as few as 5 trainees for specialist security teams up to enterprise-wide rollouts of 800 or more employees. For large organizations, we run parallel cohorts across multiple locations simultaneously to maintain training consistency across sites. Group size does not affect program quality since every cohort is instructor-led, not self-paced.
        - generic [ref=e1341]:
          - button "What is the difference between ILT and VILT?" [ref=e1342] [cursor=pointer]:
            - generic [ref=e1343]: What is the difference between ILT and VILT?
            - generic [ref=e1344]: +
          - paragraph [ref=e1345]: ILT (Instructor-Led Training) is on-site, in-person delivery where a certified trainer is physically present at your premises. VILT (Virtual Instructor-Led Training) is the live online equivalent, delivered in real time via a virtual classroom platform. Both formats are instructor-led and include hands-on labs and live trainer interaction. The choice between ILT and VILT is based on your team's location and logistics, not a quality difference.
        - generic [ref=e1346]:
          - button "How long does a cybersecurity group training program typically last?" [ref=e1347] [cursor=pointer]:
            - generic [ref=e1348]: How long does a cybersecurity group training program typically last?
            - generic [ref=e1349]: +
          - paragraph [ref=e1350]: Duration ranges from 8 hours for focused single-skill or awareness programs to 32 or more hours for advanced red-team, penetration testing, or architecture-level programs. Most group training cohorts are delivered over 2 to 5 days, with modular scheduling available to spread sessions across multiple weeks to minimize business disruption.
        - generic [ref=e1351]:
          - button "How does Edstellar vet and select cybersecurity trainers?" [ref=e1352] [cursor=pointer]:
            - generic [ref=e1353]: How does Edstellar vet and select cybersecurity trainers?
            - generic [ref=e1354]: +
          - paragraph [ref=e1355]: "Every trainer in Edstellar's network of 1,500+ cybersecurity practitioners goes through a multi-stage vetting process: a technical domain assessment, a live delivery evaluation, and ongoing client feedback reviews. Trainers are matched to your engagement based on domain expertise, technology stack alignment, industry experience, and geographic availability. You can request a trial session with your shortlisted trainer before committing your cohort."
        - generic [ref=e1356]:
          - button "How is the effectiveness of the training measured?" [ref=e1357] [cursor=pointer]:
            - generic [ref=e1358]: How is the effectiveness of the training measured?
            - generic [ref=e1359]: +
          - paragraph [ref=e1360]: Edstellar uses pre and post technical skill assessments for every cohort to establish a measurable skills delta. Results are benchmarked against role-based competency frameworks and reported in a post-program delivery summary. L&D teams receive outcome data on individual and team-level skill improvement that can be mapped to security KPIs such as MTTD, MTTR, and vulnerability remediation rates.
        - generic [ref=e1361]:
          - button "Which industries does Edstellar deliver cybersecurity training for?" [ref=e1362] [cursor=pointer]:
            - generic [ref=e1363]: Which industries does Edstellar deliver cybersecurity training for?
            - generic [ref=e1364]: +
          - paragraph [ref=e1365]: Edstellar delivers cybersecurity training programs across banking and financial services, healthcare, manufacturing, government and defense, technology and SaaS, retail, energy, and telecoms, across 100+ countries. Programs are adapted to the regulatory context of each sector, covering frameworks such as PCI-DSS, HIPAA, NIST, ISO 27001, and SEBI guidelines depending on the industry.
        - generic [ref=e1366]:
          - button "Can the training be conducted at our office premises?" [ref=e1367] [cursor=pointer]:
            - generic [ref=e1368]: Can the training be conducted at our office premises?
            - generic [ref=e1369]: +
          - paragraph [ref=e1370]: Yes. Edstellar's on-site instructor-led training deploys a certified cybersecurity trainer to your location across 100+ countries. The trainer brings all course materials, lab environments, and scenario simulations. On-site delivery is available for any group size and any geography, with scheduling coordinated around your team's availability and business calendar.
        - generic [ref=e1371]:
          - button "How is pricing structured for cybersecurity group training?" [ref=e1372] [cursor=pointer]:
            - generic [ref=e1373]: How is pricing structured for cybersecurity group training?
            - generic [ref=e1374]: +
          - paragraph [ref=e1375]: "Pricing is based on cohort size, program duration, and delivery format. Edstellar offers four group training packages: Starter (120 trainee licenses, 64 hours), Growth (320 licenses, 160 hours), Enterprise (800 licenses, 400 hours), and Custom for unlimited rollouts. All packages include trainer fees, lab environments, pre and post skill assessments, and a dedicated Learning Services Manager. Contact us for a custom quote."
        - generic [ref=e1376]:
          - button "Are there prerequisites for joining a cybersecurity training program?" [ref=e1377] [cursor=pointer]:
